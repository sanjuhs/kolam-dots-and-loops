services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      APP_URL: '${APP_URL}'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET}'
      DATABASE_PATH: /data/kolam.sqlite
      PORT: '3000'
    volumes:
      - kolam-data:/data
    mem_limit: 512m
    cpus: 1.0
volumes:
  kolam-data:
